<!-- Padrone Imóveis SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- PADRONE text with gold leaf accent in R -->
  <g transform="translate(250, 210)">
    <text x="-65" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="74" font-weight="900" fill="#0d2354" text-anchor="end" letter-spacing="4">
      PAD
    </text>
    <!-- Custom stylized R -->
    <g transform="translate(-60, -56)">
      <!-- Top loop and left leg -->
      <path d="M 10 0 L 45 0 C 65 0 78 12 78 28 C 78 44 65 54 45 54 L 28 54 L 28 80 L 10 80 Z M 28 16 L 28 38 L 42 38 C 52 38 60 34 60 28 C 60 22 52 16 42 16 Z" fill="#0d2354"/>
      <!-- Gold curved right leg -->
      <path d="M 40 46 C 56 46 68 54 78 80 L 60 80 C 52 62 44 58 34 58 Z" fill="#9e853e"/>
    </g>
    <text x="35" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="74" font-weight="900" fill="#0d2354" text-anchor="start" letter-spacing="4">
      ONE
    </text>
  </g>
  
  <!-- Subtle separator line -->
  <line x1="120" y1="236" x2="380" y2="236" stroke="#9e853e" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- IMÓVEIS -->
  <text x="250" y="278" font-family="'Inter', 'Montserrat', sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" letter-spacing="10">
    IMÓVEIS
  </text>
</svg>
